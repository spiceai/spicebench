[package]
name = "adbc-mongodb"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
adbc_core = "0.22"
adbc_ffi = "0.22"
datafusion-table-providers = { version = "0.1.0", default-features = false, features = ["mongodb"] }
arrow = { version = "57", features = ["ffi"] }
arrow-array = { version = "57", features = ["ffi"] }
arrow-schema = "57"
datafusion = "52"
tokio = { version = "1", features = ["rt-multi-thread"] }
async-trait = "0.1"
secrecy = "0.10.3"
mongodb = { version = "3.5.2" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mongodb = { version = "3.5.2", features = ["openssl-tls"] }

[workspace]

[patch.crates-io]
