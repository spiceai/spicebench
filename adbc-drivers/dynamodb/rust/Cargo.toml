[package]
name = "adbc-dynamodb"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
adbc_core = "0.22"
adbc_ffi = "0.22"
data_components = { git = "https://github.com/spiceai/spiceai.git", rev = "07e0ad2b517316b5f66d0af7ae152d441b7c6a2c", default-features = false, features = ["dynamodb"] }
arrow = { version = "57", features = ["ffi"] }
arrow-array = { version = "57", features = ["ffi"] }
arrow-schema = "57"
datafusion = "52"
aws-sdk-dynamodb = "1"
aws-config = "1"
aws-credential-types = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
async-trait = "0.1"
chrono = "0.4"
futures = "0.3"
rand = "0.8"
liblzma = "0.4.6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[workspace]

# Spiceai fork patches — only crates actually in our dependency tree
[patch.crates-io]
