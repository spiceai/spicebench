name: Run (Spice - Streaming)
run-name: Run (Spice Streaming) - ${{ github.event.inputs.system_under_test }} - ${{ github.event.inputs.acceleration }} - SF${{ github.event.inputs.scale_factor }}

on:
  workflow_dispatch:
    inputs:
      system_under_test:
        description: 'Streaming source'
        required: true
        default: postgres-wal
        type: choice
        options:
          - postgres-wal
          - postgres-debezium
          - dynamodb-streams
          - mongodb-streams
      acceleration:
        description: 'Acceleration engine'
        required: true
        default: cayenne
        type: choice
        options:
          - cayenne
          - duckdb
      scenario:
        description: 'Scenario/query set to run (e.g. tpch)'
        required: true
        default: 'tpch'
        type: string
      scale_factor:
        description: 'Scale Factor'
        required: true
        default: '1'
        type: choice
        options:
          - '0.1'
          - '1'
          - '10'
      etl_type:
        description: 'ETL type'
        required: true
        default: 'changes'
        type: choice
        options:
          - events
          - changes

jobs:
  run-spicebench:
    name: Run spicebench (Spice streaming)
    runs-on: spiceai-dev-runners
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-spicebench
      # TODO: wire up spidapter docker invocation with --scenario ${system_under_test}
