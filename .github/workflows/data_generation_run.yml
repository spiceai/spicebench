name: data-generation run
run-name: data-generation run - ${{ inputs.scenario || github.event.inputs.scenario || 'tpch' }} - sf${{ inputs.scale_factor || github.event.inputs.scale_factor || '0.01' }}

on:
  workflow_call:
    inputs:
      scenario:
        required: false
        default: 'tpch'
        type: string
      scale_factor:
        required: false
        default: '0.01'
        type: string
      bucket:
        required: false
        default: 'spiceai-public-datasets'
        type: string
      prefix:
        required: false
        default: 'data-gen'
        type: string
      region:
        required: false
        default: 'us-east-1'
        type: string
      num_steps:
        required: false
        default: '25'
        type: string
      checkpoint_interval_steps:
        required: false
        default: '100'
        type: string
      update_ratio:
        required: false
        default: '0'
        type: string
      delete_ratio:
        required: false
        default: '0'
        type: string
      bootstrap:
        required: false
        default: false
        type: boolean
      bootstrap_mutation_steps:
        required: false
        default: '20'
        type: string
      bootstrap_churn_fraction:
        required: false
        default: '0.17'
        type: string
    secrets:
      MINIO_ENDPOINT:
        required: true
      MINIO_ACCESS_KEY_ID:
        required: true
      MINIO_SECRET_ACCESS_KEY:
        required: true
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Dataset/scenario to generate (e.g. tpch)'
        required: true
        default: 'tpch'
        type: string
      scale_factor:
        description: 'TPC-H scale factor'
        required: true
        default: '0.01'
        type: string
      bucket:
        description: 'S3 bucket name'
        required: false
        default: 'spicebench'
        type: string
      prefix:
        description: 'Base S3 key prefix for generated files (scenario is appended automatically)'
        required: false
        default: 'data-gen'
        type: string
      region:
        description: 'AWS region'
        required: true
        default: 'us-east-1'
        type: string
      num_steps:
        description: 'Number of data generation steps (partitions for TPC-H dbgen)'
        required: false
        default: '20'
        type: string
      checkpoint_interval_steps:
        description: 'Every N steps to take a checkpoint'
        required: false
        default: '10'
        type: string
      update_ratio:
        description: 'Ratio of rows to update per step (0.0 to 1.0). For bootstrap, set 0.8.'
        required: false
        default: '0'
        type: string
      delete_ratio:
        description: 'Ratio of rows to delete per step (0.0 to 1.0). For bootstrap, set 0.2.'
        required: false
        default: '0'
        type: string
      bootstrap:
        description: 'Bootstrap dataset: base creates-only, then pure-mutation steps (set update/delete ratios, e.g. 0.8/0.2)'
        required: false
        default: false
        type: boolean
      bootstrap_mutation_steps:
        description: 'Bootstrap: number of pure-mutation steps appended after the base'
        required: false
        default: '20'
        type: string
      bootstrap_churn_fraction:
        description: 'Bootstrap: total fraction of the base to mutate (~0.17 on SF10 ≈ 15M)'
        required: false
        default: '0.17'
        type: string

jobs:
  run-data-generation:
    name: Run data generation
    runs-on: spiceai-dev-runners
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Cache spicebench binary
        id: cache-spicebench
        uses: actions/cache@v4
        with:
          path: ~/.spice/bin/spicebench
          key: spicebench-duckdb-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
          restore-keys: |
            spicebench-duckdb-${{ runner.os }}-

      - name: Setup Rust toolchain
        if: steps.cache-spicebench.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.91
          cache: false

      - name: Setup CC
        if: steps.cache-spicebench.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-cc

      - name: Build spicebench
        if: steps.cache-spicebench.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.spice/bin
          cargo build --release --features duckdb -p spicebench
          install -m 755 target/release/spicebench ~/.spice/bin/spicebench

      - name: Run data generation
        env:
          SCENARIO: ${{ inputs.scenario || github.event.inputs.scenario || 'tpch' }}
          SCALE_FACTOR: ${{ inputs.scale_factor || github.event.inputs.scale_factor || '0.01' }}
          BUCKET: ${{ inputs.bucket || github.event.inputs.bucket }}
          PREFIX: ${{ inputs.prefix || github.event.inputs.prefix || 'data-gen' }}
          REGION: ${{ inputs.region || github.event.inputs.region || 'us-east-1' }}
          NUM_STEPS: ${{ inputs.num_steps || github.event.inputs.num_steps || '25' }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          UPDATE_RATIO: ${{ inputs.update_ratio || github.event.inputs.update_ratio }}
          DELETE_RATIO: ${{ inputs.delete_ratio || github.event.inputs.delete_ratio }}
          BOOTSTRAP: ${{ inputs.bootstrap || github.event.inputs.bootstrap || 'false' }}
          BOOTSTRAP_MUTATION_STEPS: ${{ inputs.bootstrap_mutation_steps || github.event.inputs.bootstrap_mutation_steps || '20' }}
          BOOTSTRAP_CHURN_FRACTION: ${{ inputs.bootstrap_churn_fraction || github.event.inputs.bootstrap_churn_fraction || '0.17' }}
          RUST_LOG: info
        run: |
          ARGS="--dataset ${SCENARIO}"
          ARGS="${ARGS} --scenario ${SCENARIO}"
          ARGS="${ARGS} --scale-factor ${SCALE_FACTOR}"
          ARGS="${ARGS} --bucket ${BUCKET}"
          ARGS="${ARGS} --prefix ${PREFIX}"
          ARGS="${ARGS} --region ${REGION}"
          ARGS="${ARGS} --num-steps ${NUM_STEPS}"
          ARGS="${ARGS} --endpoint ${MINIO_ENDPOINT}"

          if [ -n "${UPDATE_RATIO}" ]; then
            ARGS="${ARGS} --update-ratio ${UPDATE_RATIO}"
          fi
          if [ -n "${DELETE_RATIO}" ]; then
            ARGS="${ARGS} --delete-ratio ${DELETE_RATIO}"
          fi
          # Bootstrap dataset: full base (creates-only) + pure-mutation steps.
          if [ "${BOOTSTRAP}" = "true" ]; then
            ARGS="${ARGS} --bootstrap"
            ARGS="${ARGS} --bootstrap-mutation-steps ${BOOTSTRAP_MUTATION_STEPS}"
            ARGS="${ARGS} --bootstrap-churn-fraction ${BOOTSTRAP_CHURN_FRACTION}"
          fi

          echo "Running: spicebench generate ${ARGS}"
          ~/.spice/bin/spicebench generate ${ARGS}

      - name: Run checkpointer
        env:
          SCENARIO: ${{ inputs.scenario || github.event.inputs.scenario || 'tpch' }}
          SCALE_FACTOR: ${{ inputs.scale_factor || github.event.inputs.scale_factor || '0.01' }}
          BUCKET: ${{ inputs.bucket || github.event.inputs.bucket }}
          PREFIX: ${{ inputs.prefix || github.event.inputs.prefix || 'data-gen' }}
          REGION: ${{ inputs.region || github.event.inputs.region || 'us-east-1' }}
          CHECKPOINT_INTERVAL_STEPS: ${{ inputs.checkpoint_interval_steps || github.event.inputs.checkpoint_interval_steps || '100' }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          RUST_LOG: info
        run: |
          # Bootstrap datasets also get checkpoints: the checkpointer replays the
          # base then the mutation steps (it reads the bootstrap layout from
          # version.json), producing checkpoint 0 = full base and one checkpoint per
          # CHECKPOINT_INTERVAL_STEPS mutation steps. CHECKPOINT_INTERVAL_STEPS is the
          # mutation checkpoint cadence the run must use (e.g. 2).

          VERSION=$(python3 - <<'PY'
          import os

          sf = float(os.environ["SCALE_FACTOR"])
          s = format(sf, ".15g")
          if "e" in s or "E" in s:
            s = ("%.15f" % sf).rstrip("0").rstrip(".")
          if "." not in s:
            s = f"{s}.0"
          print(s)
          PY
          )

          ARGS="--scenario ${SCENARIO}"
          ARGS="${ARGS} --version ${VERSION}"
          ARGS="${ARGS} --bucket ${BUCKET}"
          ARGS="${ARGS} --prefix ${PREFIX}"
          ARGS="${ARGS} --duckdb-path ./checkpointer.duckdb"
          ARGS="${ARGS} --checkpoint-dir ./checkpoints"

          if [ -n "${REGION}" ]; then
            ARGS="${ARGS} --region ${REGION}"
          fi

          ARGS="${ARGS} --checkpoint-interval-steps ${CHECKPOINT_INTERVAL_STEPS}"
          ARGS="${ARGS} --endpoint ${MINIO_ENDPOINT}"

          echo "Running: spicebench checkpoint ${ARGS}"
          ~/.spice/bin/spicebench checkpoint ${ARGS}
