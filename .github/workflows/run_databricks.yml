name: Run (Databricks)
run-name: Run (Databricks) - ${{ github.event.inputs.system_under_test }} - ${{ github.event.inputs.scenario }} - SF${{ github.event.inputs.scale_factor }}

on:
  workflow_dispatch:
    inputs:
      system_under_test:
        description: 'Databricks variant'
        required: true
        default: databricks-sql
        type: choice
        options:
          - databricks-sql
          - databricks-lakebase
      scenario:
        description: 'Scenario/query set to run (e.g. tpch)'
        required: true
        default: 'tpch'
        type: string
      scale_factor:
        description: 'Scale Factor'
        required: true
        default: '1'
        type: choice
        options:
          - '0.1'
          - '1'
          - '10'
      etl_type:
        description: 'ETL type'
        required: true
        default: 'changes'
        type: choice
        options:
          - events
          - changes

jobs:
  run-spicebench:
    name: Run spicebench (Databricks)
    runs-on: spiceai-dev-runners
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-spicebench
      # TODO: wire up databricks adapter build, secrets, and spicebench invocation
