name: Run (Debug - Spice Cloud)
run-name: Run (Debug) - ${{ github.event.inputs.system_under_test || 'spice_cloud' }}

on:
  workflow_dispatch:
    inputs:
      system_under_test:
        description: 'System under test'
        required: true
        default: spice_cloud
        type: choice
        options:
          - spice_cloud
      environment:
        description: 'Target Spice Cloud Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      scenario:
        description: 'Scenario/query set to run (e.g. tpch)'
        required: true
        default: 'tpch'
        type: string
      etl_type:
        description: 'ETL type'
        required: true
        default: 'events'
        type: choice
        options:
          - events
          - changes
      scale_factor:
        description: 'Scale Factor'
        required: true
        default: '1'
        type: choice
        options:
          - '0.1'
          - '1'
          - '10'
      spidapter_version:
        description: 'Spidapter image version tag (e.g. latest, v1.0.0)'
        required: false
        default: 'latest'
        type: string
      custom_image_tag:
        description: 'Custom spiced image tag from ghcr.io/spiceai/spiceai-dev (uses internal channel)'
        required: false
        default: ''
        type: string
      num_query_clients:
        description: 'Number of concurrent query clients'
        required: false
        default: '2'
        type: string
      executor_replicas:
        description: 'Number of executor replicas'
        required: false
        default: '4'
        type: string
      app_memory_limit:
        description: 'Memory limit for the scheduler pod (e.g. 16Gi, 62Gi)'
        required: false
        default: '16Gi'
        type: string
      executor_memory_limit:
        description: 'Memory limit for the executor pod (e.g. 16Gi, 62Gi)'
        required: false
        default: '16Gi'
        type: string
      adbc_update_strategy:
        description: 'ADBC update strategy'
        required: false
        default: 'bulk_ingest_upsert'
        type: choice
        options:
          - bulk_ingest_upsert
          - staging_table
      enable_pvc:
        description: 'Enable PVC block storage for scheduler and executor pods'
        required: false
        default: false
        type: boolean
      use_private_cluster:
        description: 'Pin to private cluster (spicehq org tag)'
        required: false
        default: false
        type: boolean
      enable_module_debug_logging:
        description: 'Enable debug logs'
        required: false
        default: false
        type: boolean
      disable_teardown:
        description: 'Skip teardown — keeps SCP app alive for inspection'
        required: false
        default: false
        type: boolean

jobs:
  run-spicebench:
    name: Run spicebench (Spice Cloud debug)
    runs-on: spiceai-dev-runners
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-cc

      - uses: ./.github/actions/management-login
        with:
          token-url: ${{ github.event.inputs.environment == 'prod' && 'https://spice.ai/api/oauth/token' || 'https://dev.spice.ai/api/oauth/token' }}
          client-id: ${{ github.event.inputs.environment == 'prod' && secrets.SPICE_MANAGEMENT_CLIENT_ID_PROD || secrets.SPICE_MANAGEMENT_CLIENT_ID }}
          client-secret: ${{ github.event.inputs.environment == 'prod' && secrets.SPICE_MANAGEMENT_CLIENT_SECRET_PROD || secrets.SPICE_MANAGEMENT_CLIENT_SECRET }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull spidapter image
        run: docker pull ghcr.io/spiceai/spidapter:${{ github.event.inputs.spidapter_version || 'latest' }}

      - uses: ./.github/actions/build-spicebench

      - name: Install ADBC FlightSQL driver
        uses: columnar-tech/setup-dbc@v1
        with:
          drivers: flightsql

      - name: Run spicebench
        env:
          SPICEAI_API_KEY: ${{ env.SPICEAI_API_KEY }}
          SPICE_CLOUD_API_URL: ${{ github.event.inputs.environment == 'prod' && 'https://api.spice.ai' || 'https://dev-api.spice.ai' }}
          SCENARIO: ${{ github.event.inputs.scenario || 'tpch' }}
          SCALE_FACTOR: ${{ github.event.inputs.scale_factor || '1' }}
          NUM_QUERY_CLIENTS: ${{ github.event.inputs.num_query_clients || '2' }}
          ETL_BUCKET: spicebench
          ETL_PREFIX: ${{ github.event.inputs.etl_type == 'changes' && 'data-gen-mutable' || 'data-gen' }}
          ETL_REGION: us-east-1
          ETL_SINK: adbc
          SCHEDULER_STATE_LOCATION: s3://spiceai-testing-cluster-state/spicebench-scheduler-state-${{ github.run_id }}/
          VALIDATE_CHECKPOINT_RESULTS: 'true'
          SCRAPE_SUT_METRICS: 'true'
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          S3_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SPIDAPTER_APP_MEMORY_LIMIT: ${{ github.event.inputs.app_memory_limit || '16Gi' }}
          SPIDAPTER_EXECUTOR_MEMORY_LIMIT: ${{ github.event.inputs.executor_memory_limit || '16Gi' }}
          SPIDAPTER_EXECUTOR_REPLICAS: ${{ github.event.inputs.executor_replicas || '4' }}
          SPIDAPTER_ICEBERG_REGION: us-west-1
          SPIDAPTER_ICEBERG_CATALOG_FROM: iceberg:https://glue.us-west-1.amazonaws.com/iceberg/v1/catalogs/211125479522/namespaces
          ENABLE_MODULE_DEBUG_LOGGING: ${{ github.event.inputs.enable_module_debug_logging || 'false' }}
          DISABLE_TEARDOWN: ${{ github.event.inputs.disable_teardown || 'false' }}
          ENABLE_PVC: ${{ github.event.inputs.enable_pvc || 'false' }}
          USE_PRIVATE_CLUSTER: ${{ github.event.inputs.use_private_cluster || 'false' }}
          CUSTOM_IMAGE_TAG: ${{ github.event.inputs.custom_image_tag || '' }}
        run: |
          set -euo pipefail
          if [ "${ENABLE_MODULE_DEBUG_LOGGING}" = "true" ]; then
            export RUST_LOG='info,etl=debug,spicebench=debug,data_generation=debug'
          else
            export RUST_LOG='info,etl::sink::adbc=debug'
          fi

          export SPICEBENCH_ADBC_UPDATE_STRATEGY=${{ github.event.inputs.adbc_update_strategy || 'bulk_ingest_upsert' }}
          export SPICEBENCH_ADBC_DELETE_BATCH_SIZE=50000
          if [ "${SPICEBENCH_ADBC_UPDATE_STRATEGY}" = "bulk_ingest_upsert" ]; then
            export SPICEBENCH_ADBC_FLUSH_STREAM_BEFORE_UPSERT=true
          else
            export SPICEBENCH_ADBC_REUSE_BULK_INGEST_STREAMS=false
          fi

          EXECUTOR_INSTANCE_TYPE="github-hosted-ubuntu-latest"
          ETL_ENDPOINT="${MINIO_ENDPOINT}"

          ETL_ARGS="--etl-bucket ${ETL_BUCKET} --scale-factor ${SCALE_FACTOR} --etl-prefix ${ETL_PREFIX} --etl-region ${ETL_REGION}"
          [ -n "${ETL_ENDPOINT:-}" ] && ETL_ARGS="${ETL_ARGS} --etl-endpoint ${ETL_ENDPOINT}"

          VALIDATION_ARGS=""
          [ "${VALIDATE_CHECKPOINT_RESULTS}" = "true" ] && VALIDATION_ARGS="--validate-results"

          SUT_METRICS_ARGS=""
          [ "${SCRAPE_SUT_METRICS}" = "true" ] && SUT_METRICS_ARGS="--scrape-sut-metrics"

          NO_TEARDOWN_ARG=""
          [ "${DISABLE_TEARDOWN}" = "true" ] && NO_TEARDOWN_ARG="--no-teardown"

          SPIDAPTER_CHANNEL="nightly"
          [ -n "${CUSTOM_IMAGE_TAG}" ] && SPIDAPTER_CHANNEL="internal"

          ADAPTER_DOCKER_OPTS="run -i"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_SCENARIO=cayenne"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_CHANNEL=${SPIDAPTER_CHANNEL}"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPICEAI_API_KEY -e SPICE_CLOUD_API_URL"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID} -e AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY}"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SCHEDULER_STATE_LOCATION"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_APP_MEMORY_LIMIT"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_EXECUTOR_MEMORY_LIMIT"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_EXECUTOR_REPLICAS"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_ICEBERG_REGION"
          ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_ICEBERG_CATALOG_FROM"

          if [ "${USE_PRIVATE_CLUSTER}" = "true" ]; then
            ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_ORGANIZATION_TAG=spicehq"
          fi

          if [ "${ENABLE_PVC}" = "true" ]; then
            echo "PVC enabled: app=3GB, executor=2GB, Cayenne dirs=/data/{data,metadata}"
            ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_APP_STORAGE_SIZE_GB=3"
            ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_EXECUTOR_STORAGE_SIZE_GB=2"
            ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_CAYENNE_DATA_DIR=/data/data"
            ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_CAYENNE_METADATA_DIR=/data/metadata"
          fi

          [ -n "${CUSTOM_IMAGE_TAG}" ] && ADAPTER_DOCKER_OPTS="${ADAPTER_DOCKER_OPTS} -e SPIDAPTER_IMAGE_TAG=${CUSTOM_IMAGE_TAG}"

          ADAPTER_ARGS="${ADAPTER_DOCKER_OPTS} ghcr.io/spiceai/spidapter:${{ github.event.inputs.spidapter_version || 'latest' }} stdio --verbose"

          set -x
          ~/.spice/bin/spicebench run \
            --concurrency "${NUM_QUERY_CLIENTS}" \
            --scenario "${SCENARIO}" \
            --executor-instance-type "${EXECUTOR_INSTANCE_TYPE}" \
            ${ETL_ARGS} \
            --etl-sink "${ETL_SINK}" \
            --table-format parquet \
            ${VALIDATION_ARGS} \
            ${SUT_METRICS_ARGS} \
            --system-adapter-stdio-cmd docker \
            --system-adapter-stdio-args "${ADAPTER_ARGS}" \
            --system-adapter-env "SCHEDULER_STATE_LOCATION=${SCHEDULER_STATE_LOCATION}" \
            ${NO_TEARDOWN_ARG}
