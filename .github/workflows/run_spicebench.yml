name: Run spicebench
run-name: Run spicebench - ${{ github.event.inputs.scenario || 'tpch' }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario/query set to run (e.g. tpch)"
        required: true
        default: "tpch"
        type: string
      etl_bucket:
        description: 'S3 bucket for ETL source and target data'
        required: true
        type: string
      etl_source_prefix:
        description: 'S3 key prefix for ETL source data'
        required: false
        default: ''
        type: string
      etl_target_prefix:
        description: 'S3 key prefix for ETL target (rehydrated) data'
        required: false
        default: ''
        type: string
      etl_region:
        description: 'AWS region for the ETL S3 bucket'
        required: false
        default: "us-east-1"
        type: string
      etl_endpoint:
        description: 'S3 endpoint URL for ETL bucket (for MinIO/LocalStack)'
        required: false
        type: string
      etl_num_steps:
        description: 'Number of ETL data generation steps (partitions)'
        required: false
        default: '25'
        type: string

jobs:
  run-spicebench:
    name: Run spicebench
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/management-login
        with:
          client-id: ${{ secrets.SPICE_MANAGEMENT_CLIENT_ID }}
          client-secret: ${{ secrets.SPICE_MANAGEMENT_CLIENT_SECRET }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull spidapter image
        run: docker pull ghcr.io/spiceai/spidapter:latest

      - uses: ./.github/actions/build-spicebench

      - name: Install ADBC FlightSQL driver
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          dbc install flightsql

      - name: Run spicebench
        env:
          SPICEAI_API_KEY: ${{ env.SPICEAI_API_KEY }}
          SPICE_CLOUD_API_URL: https://dev-api.spice.ai
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SCENARIO: ${{ github.event.inputs.scenario || 'tpch' }}
          ETL_BUCKET: ${{ github.event.inputs.etl_bucket }}
          ETL_SOURCE_PREFIX: ${{ github.event.inputs.etl_source_prefix }}
          ETL_TARGET_PREFIX: ${{ github.event.inputs.etl_target_prefix }}
          ETL_REGION: ${{ github.event.inputs.etl_region || 'us-east-1' }}
          ETL_ENDPOINT: ${{ github.event.inputs.etl_endpoint }}
          ETL_NUM_STEPS: ${{ github.event.inputs.etl_num_steps || '25' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          ETL_ARGS="--etl-bucket ${ETL_BUCKET} --etl-num-steps ${ETL_NUM_STEPS}"
          if [ -n "${ETL_SOURCE_PREFIX}" ]; then
            ETL_ARGS="${ETL_ARGS} --etl-source-prefix ${ETL_SOURCE_PREFIX}"
          fi
          if [ -n "${ETL_TARGET_PREFIX}" ]; then
            ETL_ARGS="${ETL_ARGS} --etl-target-prefix ${ETL_TARGET_PREFIX}"
          fi
          if [ -n "${ETL_REGION}" ]; then
            ETL_ARGS="${ETL_ARGS} --etl-region ${ETL_REGION}"
          fi
          if [ -n "${ETL_ENDPOINT}" ]; then
            ETL_ARGS="${ETL_ARGS} --etl-endpoint ${ETL_ENDPOINT}"
          fi

          ~/.spice/bin/spicebench \
            --concurrency 2  \
            --scenario "${SCENARIO}" \
            ${ETL_ARGS} \
            --system-adapter-stdio-cmd docker \
            --system-adapter-stdio-args "run -i -e SPICEAI_API_KEY -e SPICE_CLOUD_API_URL ghcr.io/spiceai/spidapter:latest stdio --verbose"
