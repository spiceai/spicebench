[package]
name = "databricks-system-adapter"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spiceai/spicebench"

[workspace]

[dependencies]
anyhow = "1.0.99"
arrow-schema = "58.0.0"
base64 = "0.22"
async-trait = "0.1.89"
clap = { version = "4.5.54", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
system-adapter-protocol = { path = "../../crates/system-adapter-protocol", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"
urlencoding = "2"
uuid = "1"
