[workspace]
exclude = ["system-adapters/databricks"]
members = [
    ".",
    "crates/adbc_client",
    "crates/checkpointer",
    "crates/data-generation",
    "crates/duration-parse", "crates/etl",
    "crates/flight_client",
    "crates/otel-arrow",
    "crates/system-adapter-protocol",
    "crates/telemetry",
    "crates/test-framework",
    "crates/util",
    "crates/yaml",
]

[workspace.package]
edition = "2024"
exclude = []
homepage = "https://spice.ai"
license = "Apache-2.0"
repository = "https://github.com/spiceai/spicebench"
rust-version = "1.91.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.99"
arrow = { version = "58.0.0", features = ["prettyprint"] }
aws-config = { version = "1" }
aws-sdk-dynamodb = { version = "1" }
arrow-array = "58.0.0"
arrow-buffer = "58.0.0"
arrow-cast = "58.0.0"
arrow-flight = "58.0.0"
arrow-ipc = "58.0.0"
arrow-schema = "58.0.0"
async-trait = "0.1.89"
base64 = "0.22.1"
byte-unit = "5.1.4"
bytes = "1.10.0"
chrono = "0.4.44"
clap = { version = "4.5.54", features = ["derive", "env"] }
duckdb = "1.10503" # 1.10503.x corresponds to DuckDB v1.5.3 (matches spiceai; arrow-58 compatible)
mongodb = { version = "3.5.2" }
duration-parse = { path = "crates/duration-parse" }
tpchgen = "2.0.2"
tpchgen-arrow = "2.0.2"
futures = "0.3.30"
http = "1.3.1"
humantime = "2.1.0"
indexmap = { version = "2", features = ["serde"] }
insta = { version = "1.46.1", features = ["filters"] }
nix = { version = "0.30", features = ["signal"] }
object_store = { version = "0.12.4", features = [
    "aws",
    "gcp",
    "azure",
    "http",
] }
opentelemetry = { version = "0.31", default-features = false, features = [
    "metrics",
    "trace",
] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "metrics",
    "grpc-tonic",
    "http-proto",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "metrics",
    "rt-tokio",
    "trace",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_metrics_custom_reader",
] }
parking_lot = "0.12"
parquet = "58.0.0"
r2d2 = "0.8.10"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "=0.12.24", features = ["json", "rustls-tls"] }
rustls = "0.23"
schemars = "1.2.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
snafu = "0.8.6"
sysinfo = "0.37.2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "signal",
    "macros",
    "test-util",
    "time",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tonic = { version = "0.14", features = [
    "gzip",
    "tls-ring",
    "tls-native-roots",
] }
tower = "0.5.2"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
util = { path = "crates/util" }
uuid = "1"


[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
name = "spicebench"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
adbc_client = { path = "crates/adbc_client" }
arrow.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
base64.workspace = true
async-trait.workspace = true
checkpointer = { path = "crates/checkpointer" }
clap.workspace = true
data-generation = { path = "crates/data-generation" }
etl = { path = "crates/etl", features = ["dynamodb", "mongodb"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
system-adapter-protocol = { path = "crates/system-adapter-protocol" }
tempfile.workspace = true
test-framework = { path = "crates/test-framework" }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
parquet.workspace = true

[features]
default = []
anonymous_telemetry = []
aws-secrets-manager = []
clickhouse = []
databricks = []
debezium = []
delta_lake = []
dremio = []
duckdb = ["etl/duckdb"]
flightsql = []
ftp = []
imap = []
keyring-secret-store = []
models = []
mssql = []
mysql = []
odbc = []
postgres = []
sharepoint = []
snowflake = []
spark = []
sqlite = []
turso = []

[patch.crates-io]
# Patch duckdb for direct dependencies and spiceai_duckdb_fork for datafusion-table-providers
duckdb = { git = "https://github.com/spiceai/duckdb-rs.git", rev = "4387e69564d85a411802e0782bc503b53577c50d" } # branch: spiceai-58-arrow58

# arrow-rs 57.2 with spice patches
arrow = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }        # branch: lukim/spiceai-58.3.0
arrow-arith = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }  # branch: lukim/spiceai-58.3.0
arrow-array = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }  # branch: lukim/spiceai-58.3.0
arrow-buffer = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" } # branch: lukim/spiceai-58.3.0
arrow-cast = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }   # branch: lukim/spiceai-58.3.0
arrow-csv = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }    # branch: lukim/spiceai-58.3.0
arrow-data = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }   # branch: lukim/spiceai-58.3.0
arrow-flight = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" } # branch: lukim/spiceai-58.3.0
arrow-ipc = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }    # branch: lukim/spiceai-58.3.0
arrow-json = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }   # branch: lukim/spiceai-58.3.0
arrow-ord = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }    # branch: lukim/spiceai-58.3.0
arrow-row = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }    # branch: lukim/spiceai-58.3.0
arrow-schema = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" } # branch: lukim/spiceai-58.3.0
arrow-select = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" } # branch: lukim/spiceai-58.3.0
arrow-string = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" } # branch: lukim/spiceai-58.3.0
parquet = { git = "https://github.com/spiceai/arrow-rs.git", rev = "18a40370d014a0f8eed12ee0d5a914e8cb2070d8" }      # branch: lukim/spiceai-58.3.0

# tpchgen-rs main with arrow 58 support (PR #246 "Bump arrow-rs version to 58.0.0",
# merged 2026-03-04). The published 2.0.2 crate still caps arrow at <58, so pin the
# git rev until a 58-compatible version is released to crates.io.
tpchgen = { git = "https://github.com/clflushopt/tpchgen-rs.git", rev = "438e9c2dbc25b2fff82c0efc08b3f13b5707874f" }
tpchgen-arrow = { git = "https://github.com/clflushopt/tpchgen-rs.git", rev = "438e9c2dbc25b2fff82c0efc08b3f13b5707874f" }
