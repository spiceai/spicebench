[workspace]
members = [
    ".",
    "crates/adbc_client",
    "crates/app",
    "crates/data-generation",
    "crates/duration-parse",
    "crates/flight_client",
    "crates/otel-arrow",
    "crates/spicepod",
    "crates/system-adapter-protocol",
    "crates/telemetry",
    "crates/test-framework",
    "crates/util",
    "crates/yaml",
]

[workspace.package]
edition = "2024"
exclude = []
homepage = "https://spice.ai"
license = "Apache-2.0"
repository = "https://github.com/spiceai/spicebench"
rust-version = "1.91.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.99"
arrow = { version = "57.0.0", features = ["prettyprint"] }
arrow-array = "57.0.0"
arrow-buffer = "57.0.0"
arrow-flight = "57.0.0"
arrow-json = "57.0.0"
arrow-schema = "57.0.0"
async-openai = { git = "https://github.com/spiceai/async-openai", rev = "7d5d31718143bf847cbc46286d4be26f035b58a0", features = [
    "byot",
    "embedding",
    "chat-completion",
    "responses",
    "model",
] }
async-trait = "0.1.89"
aws-config = "1.8.13"
aws-credential-types = "1.2.11"
aws-sdk-dynamodb = "1.104.0"
base64 = "0.22.1"
byte-unit = "5.1.4"
bytes = "1.10.0"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive", "env"] }
datafusion = "51.0.0"
duckdb = "1.4.4"
duration-parse = { path = "crates/duration-parse" }
futures = "0.3.30"
hf-hub = { version = "0.4", features = ["tokio"] }
http = "1.3.1"
humantime = "2.1.0"
indexmap = "2"
insta = { version = "1.46.1", features = ["filters"] }
itertools = "0.14"
nix = "0.30"
object_store = { version = "0.12.4", features = [
    "aws",
    "gcp",
    "azure",
    "http",
] }
opentelemetry = { version = "0.31", default-features = false, features = [
    "metrics",
    "trace",
] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "metrics",
    "grpc-tonic",
    "http-proto",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "metrics",
    "rt-tokio",
    "trace",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_metrics_custom_reader",
] }
parking_lot = "0.12"
parquet = "57.0.0"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "=0.12.24", features = ["json", "rustls-tls"] }
rustls = "0.23"
schemars = "1.2.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
snafu = "0.8.6"
sysinfo = "0.37.2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "signal",
    "macros",
    "test-util",
    "time",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tonic = { version = "0.14", features = [
    "gzip",
    "tls-ring",
    "tls-native-roots",
] }
tower = "0.5.2"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
util = { path = "crates/util" }
uuid = "1"

spiceai = { git = "https://github.com/spiceai/spice-rs.git", rev = "4c63970cf1d78c71eb69e2f4346d5d4795631b47" } # branch: trunk

[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
name = "spicebench"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow.workspace = true
arrow-json.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-dynamodb.workspace = true
bollard = "0.18.1"
clap.workspace = true
futures.workspace = true
itertools.workspace = true
hf-hub = { workspace = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml = { path = "crates/yaml" }
spiceai.workspace = true
spicepod = { path = "crates/spicepod" }
system-adapter-protocol = { path = "crates/system-adapter-protocol" }
test-framework = { path = "crates/test-framework" }
rand.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[features]
default = []
anonymous_telemetry = []
aws-secrets-manager = []
clickhouse = []
databricks = []
debezium = []
delta_lake = []
dremio = []
flightsql = []
ftp = []
imap = []
keyring-secret-store = []
models = []
mssql = []
mysql = []
odbc = []
postgres = []
sharepoint = []
snowflake = []
spark = []
sqlite = []
turso = []

[patch.crates-io]
# Patch duckdb for direct dependencies and spiceai_duckdb_fork for datafusion-table-providers
duckdb = { git = "https://github.com/spiceai/duckdb-rs.git", rev = "f4096c7592ed46b9e68755a49252d69783dece96" } # spiceai-1.4.4

# arrow-rs 57.2 with spice patches
arrow = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }        # spiceai-57.2
arrow-array = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }  # spiceai-57.2
arrow-buffer = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" } # spiceai-57.2
arrow-data = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }   # spiceai-57.2
arrow-flight = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" } # spiceai-57.2
arrow-ipc = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }    # spiceai-57.2
arrow-json = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }   # spiceai-57.2
arrow-ord = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }    # spiceai-57.2
arrow-schema = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" } # spiceai-57.2
arrow-select = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" } # spiceai-57.2
parquet = { git = "https://github.com/spiceai/arrow-rs.git", rev = "ca671dd37d73b730938f77f7a7ad76545280a4a8" }      # spiceai-57.2

object_store = { git = "https://github.com/apache/arrow-rs-object-store", rev = "f0a772cd49d2ebb1f19f487ccd93d705f48dc891" }
