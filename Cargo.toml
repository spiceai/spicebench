[workspace]
members = [
    ".",
    "crates/app",
    "crates/duration-parse",
    "crates/flight_client",
    "crates/otel-arrow",
    "crates/spicepod",
    "crates/telemetry",
    "crates/test-framework",
    "crates/util",
    "crates/yaml",
]

[workspace.package]
edition = "2024"
exclude = []
homepage = "https://spice.ai"
license = "Apache-2.0"
repository = "https://github.com/spiceai/spicebench"
rust-version = "1.91.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
arrow = "57"
arrow-buffer = "57"
arrow-flight = "57"
arrow-json = "57"
arrow-schema = "57"
async-openai = "0.32"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-dynamodb = "1"
base64 = "0.21"
byte-unit = "5"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
datafusion = "51"
duckdb = "1.4"
duration-parse = { path = "crates/duration-parse" }
futures = "0.3"
hf-hub = "0.4"
http = "1"
humantime = "2"
insta = { version = "1", features = ["filters"] }
itertools = "0.14"
object_store = "0.12"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["metrics", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.31", features = ["experimental_metrics_custom_reader"] }
parking_lot = "0.12"
rand = "0.9"
regex = "1"
reqwest = "0.12"
rustls = "0.23"
schemars = "0.9"
secrecy = "0.10"
serde = "1"
serde_json = "1"
sha2 = "0.10"
snafu = "0.8"
spiceai = { git = "https://github.com/spiceai/spice-rs.git", rev = "4c63970cf1d78c71eb69e2f4346d5d4795631b47" } # branch: trunk
sysinfo = "0.37"
tempfile = "3"
tokio = "1"
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = "1"

[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
name = "spicebench"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow.workspace = true
arrow-json.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-dynamodb.workspace = true
bollard = "0.18.1"
clap.workspace = true
duckdb = { workspace = true, features = ["bundled"] }
futures.workspace = true
itertools.workspace = true
hf-hub = { workspace = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml = { path = "crates/yaml" }
spiceai.workspace = true
spicepod = { path = "crates/spicepod" }
test-framework = { path = "crates/test-framework" }
rand.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[features]
default = ["append"]
anonymous_telemetry = []
aws-secrets-manager = []
clickhouse = []
databricks = []
debezium = []
delta_lake = []
dremio = []
duckdb = []
flightsql = []
ftp = []
imap = []
keyring-secret-store = []
models = []
mssql = []
mysql = []
odbc = []
postgres = []
sharepoint = []
snowflake = []
spark = []
sqlite = []
turso = []

append = ["test-framework/file_append"]
