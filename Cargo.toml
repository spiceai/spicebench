[workspace]
default-members = ["bin/spicebench"]
members = [
    "bin/spicebench",
    "crates/app",
    "crates/duration-parse",
    "crates/flight_client",
    "crates/otel-arrow",
    "crates/spicepod",
    "crates/telemetry",
    "crates/test-framework",
    "crates/util",
    "crates/yaml",
]

resolver = "2"

[workspace.package]
edition = "2024"
exclude = [".github/"]
homepage = "https://spice.ai"
license = "Apache-2.0"
repository = "https://github.com/spiceai/spicebench"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.99"
arrow = { version = "57.0.0", features = ["prettyprint"] }
arrow-buffer = "57.0.0"
arrow-flight = "57.0.0"
arrow-json = "57.0.0"
arrow-schema = "57.0.0"
async-openai = { git = "https://github.com/spiceai/async-openai", rev = "7d5d31718143bf847cbc46286d4be26f035b58a0", features = [
    "byot",
    "embedding",
    "chat-completion",
    "responses",
    "model",
] }
async-trait = "0.1.89"
aws-config = "1.8.13"
aws-credential-types = "1.2.11"
aws-sdk-dynamodb = "1.104.0"
base64 = "0.22.1"
byte-unit = "5.1.4"
bytes = "1.10.0"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive", "env"] }
datafusion = "51.0.0"
duckdb = "1.4.4"
duration-parse = { path = "crates/duration-parse" }
futures = "0.3.30"
hf-hub = { version = "0.4", features = ["tokio"] }
http = "1.3.1"
humantime = "2.1.0"
insta = { version = "1.46.1", features = ["filters"] }
itertools = "0.14"
object_store = { version = "0.12.4", features = [
    "aws",
    "gcp",
    "azure",
    "http",
] }
opentelemetry = { version = "0.31", default-features = false, features = [
    "metrics",
    "trace",
] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "metrics",
    "grpc-tonic",
    "http-proto",
    "reqwest-rustls",
] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = [
    "metrics",
    "rt-tokio",
    "trace",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_metrics_custom_reader",
] }
parking_lot = "0.12"
rand = "0.9.2"
regex = "1.12.2"
# Pinned to 0.12.24 due to hf-hub content-range header issue with 0.12.25+ (tower-http decompression change)
# See: https://github.com/seanmonstar/reqwest/pull/2840
reqwest = { version = "=0.12.24", features = ["json", "rustls-tls"] }
rustls = "0.23"
schemars = "1.2.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
snafu = "0.8.6"
spiceai = { git = "https://github.com/spiceai/spice-rs.git", rev = "4c63970cf1d78c71eb69e2f4346d5d4795631b47" } # branch: trunk
sysinfo = "0.37.2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "signal",
    "macros",
    "test-util",
    "time",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tonic = { version = "0.14", features = [
    "gzip",
    "tls-ring",
    "tls-native-roots",
] }
tower = "0.5.2"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
util = { path = "crates/util" }
uuid = "1"

[patch.crates-io]

# Tracking Issue: https://github.com/allan2/dotenvy/issues/113
dotenvy = { git = "https://github.com/spiceai/dotenvy.git", rev = "e5cef1871b08003198949dfe2da988633eaad78f" }
